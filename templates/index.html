<!DOCTYPE html>

<html lang="en">

<head>

	<meta charset="UTF-8">

	<meta
		name="viewport"
		content="width=device-width, initial-scale=1.0"
	>

	<title>
		ComicCraft - AI Comic Creator
	</title>

	<link
		rel="stylesheet"
		href="/static/css/style.css"
	>

</head>

<body class="hero">

<main class="container card">

	<h1>
		ComicCraft
	</h1>

	<p class="subtitle">
		Turn your idea into an AI comic.
	</p>

	{% if error %}

	<div class="error">

		{{ error }}

	</div>

	{% endif %}


	<form
		action="/generate"
		method="post"
	>

		<label>

			Story Prompt

			<textarea
				name="story_prompt"
				required
				placeholder="A brave fox exploring an enchanted forest..."
			></textarea>

		</label>


		<div class="grid">

			<label>

				Main Character Name

				<input
					type="text"
					name="character_name"
					required
					placeholder="Luna"
				>

			</label>


			<label>

				Setting

				<select name="setting">

					<option>
						Forest
					</option>

					<option>
						School
					</option>

					<option>
						Space
					</option>

					<option>
						City
					</option>

				</select>

			</label>


			<label>

				Story Tone

				<select name="tone">

					<option>
						Light-hearted
					</option>

					<option>
						Dramatic
					</option>

					<option>
						Poetic
					</option>

					<option>
						Funny
					</option>

				</select>

			</label>


			<label>

				Art Style

				<select name="art_style">

					<option>
						Anime
					</option>

					<option>
						Comic book
					</option>

					<option>
						Pixel art
					</option>

					<option>
						Realistic
					</option>

				</select>

			</label>

		</div>


		<button type="submit">

			Generate Comic

		</button>

	</form>

</main>

</body>

</html>
